<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mini Phone · 仿真小手机</title>
<style>
/* ================= 基础 ================= */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:#08080c;
  background-image:radial-gradient(90% 70% at 50% -10%,#1d2038 0%,#08080c 60%);
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#fff;
  user-select:none;
}

/* ================= 手机外壳 ================= */
.phone{
  position:relative;flex:none;
  width:414px;height:868px;padding:12px;
  border-radius:62px;
  background:linear-gradient(150deg,#4a4a56 0%,#1a1a22 32%,#101016 60%,#3a3a46 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.10),
    0 50px 90px -24px rgba(0,0,0,.95),
    inset 0 0 0 1px rgba(255,255,255,.06);
  transform-origin:center center;
}
.btn-side{position:absolute;width:3px;border-radius:3px;background:linear-gradient(180deg,#55555f,#1d1d24)}
.btn-side.power{right:-2px;top:210px;height:92px}
.btn-side.vup{left:-2px;top:170px;height:54px}
.btn-side.vdn{left:-2px;top:240px;height:54px}

.screen{
  position:relative;width:100%;height:100%;
  border-radius:50px;overflow:hidden;background:#000;
  isolation:isolate;
}

/* ================= 状态栏 ================= */
.statusbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;font-size:14px;font-weight:600;letter-spacing:.2px;
  color:#fff;pointer-events:none;transition:color .3s;
}
.screen.light .statusbar{color:#000}
.sb-right{display:flex;align-items:center;gap:5px}
.island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:120px;height:34px;border-radius:20px;background:#000;z-index:61;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}

/* ================= 桌面 ================= */
.desktop{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;
  padding:74px 22px 40px;
  background:
    radial-gradient(120% 70% at 18% 0%,#2c3a94 0%,transparent 58%),
    radial-gradient(90% 60% at 92% 6%,#7b2ff7 0%,transparent 55%),
    radial-gradient(110% 80% at 50% 108%,#0b2a5e 0%,transparent 62%),
    linear-gradient(180deg,#0b0d1c 0%,#05060c 100%);
  transition:transform .42s cubic-bezier(.32,.72,0,1),filter .42s;
}
.desktop.behind{transform:scale(.92);filter:brightness(.45) blur(1px)}

.clock-widget{text-align:center;margin-bottom:34px;pointer-events:none}
.cw-time{font-size:64px;font-weight:250;letter-spacing:-2px;line-height:1;
  text-shadow:0 4px 30px rgba(120,160,255,.45)}
.cw-date{font-size:14px;opacity:.72;margin-top:8px;letter-spacing:.5px}

.app-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:22px 8px;
}
.app{
  background:none;border:none;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  color:#fff;font-family:inherit;
}
.ic{
  width:58px;height:58px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px -6px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .16s ease;
}
.app:active .ic{transform:scale(.88)}
.app .label{font-size:11.5px;letter-spacing:.2px;opacity:.95;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}

.ic svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.ic.g-settings{background:linear-gradient(160deg,#8e8e93,#5a5a60)}
.ic.g-chat{background:linear-gradient(160deg,#34d058,#0aa04a)}
.ic.g-web{background:linear-gradient(160deg,#4facfe,#0066ff)}
.ic.g-photo{background:linear-gradient(160deg,#ffd166,#ff7a45)}
.ic.g-music{background:linear-gradient(160deg,#ff5f6d,#c31432)}
.ic.g-clock{background:linear-gradient(160deg,#2b2b33,#0e0e12)}
.ic.g-calc{background:linear-gradient(160deg,#7f8c9b,#3a4450)}
.ic.g-cam{background:linear-gradient(160deg,#a18cd1,#5b4bd6)}

/* ================= App 层 ================= */
.app-layer{
  position:absolute;inset:0;z-index:40;
  transform:translateY(100%);
  transition:transform .42s cubic-bezier(.32,.72,0,1);
  background:#f2f2f7;border-radius:50px;overflow:hidden;
}
.app-layer.open{transform:translateY(0)}

.page{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:#f2f2f7;color:#000;
  opacity:0;visibility:hidden;transform:translateX(26px);
  transition:opacity .26s ease,transform .26s ease,visibility .26s;
}
.page.active{opacity:1;visibility:visible;transform:none}

/* 顶部栏 */
.hd{
  position:relative;z-index:5;flex:none;
  display:flex;align-items:center;gap:12px;
  padding:58px 16px 12px;
  background:rgba(242,242,247,.86);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(0,0,0,.07);
}
.hd h1{font-size:21px;font-weight:700;margin:0;flex:1;letter-spacing:-.4px}
.hd .back{
  background:none;border:none;padding:0;cursor:pointer;
  color:#007aff;font-size:16px;font-family:inherit;font-weight:400;
  display:flex;align-items:center;gap:2px;
}
.hd .act{
  background:none;border:none;padding:0;cursor:pointer;
  color:#007aff;font-size:26px;font-weight:300;line-height:1;
  font-family:inherit;
}
.hd .act.save{font-size:16px;font-weight:600}

.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 0 46px;
  -webkit-overflow-scrolling:touch;
}
.scroll::-webkit-scrollbar{width:0}

/* 分组卡片 */
.group{
  background:#fff;border-radius:14px;margin:0 16px 18px;
  overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.cell{
  position:relative;width:100%;display:flex;align-items:center;gap:12px;
  padding:13px 16px;background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:15.5px;color:#000;text-align:left;
}
.cell + .cell::before{
  content:'';position:absolute;top:0;left:16px;right:0;height:1px;
  background:#e6e6ea;transform:scaleY(.5);
}
.cell:active{background:#f5f5f7}
.cell-icon{
  width:29px;height:29px;border-radius:8px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:#e9e9ee;
}
.cell-title{flex:1;min-width:0}
.cell-value{font-size:15px;color:#8a8a8e;max-width:150px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:#c4c4c8;font-size:19px;font-weight:400;margin-left:-2px}

/* 供应商徽标 */
.pbadge{
  width:32px;height:32px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;
}
.pbadge.official{background:linear-gradient(150deg,#3d8bff,#0a5be0)}
.pbadge.relay{background:linear-gradient(150deg,#ff9f43,#f06a00)}

.pname{font-size:15.5px;font-weight:500;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.purl{font-size:12.5px;color:#8a8a8e;margin-top:2px;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.radio{
  width:22px;height:22px;border-radius:50%;flex:none;
  border:1.5px solid #c8c8ce;position:relative;transition:.18s;
}
.radio.on{border-color:#007aff;background:#007aff}
.radio.on::after{
  content:'';position:absolute;inset:0;margin:auto;
  width:8px;height:8px;border-radius:50%;background:#fff;
}

/* 空状态 */
.empty{
  padding:56px 24px;text-align:center;color:#8a8a8e;font-size:14.5px;line-height:1.9;
}
.empty .big{font-size:40px;display:block;margin-bottom:12px;opacity:.5}
.empty span{font-size:12.5px;color:#b0b0b6}

.hint{
  margin:0 22px;font-size:12.5px;color:#8a8a8e;line-height:1.7;
}

/* 表单 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 16px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 14px;border-radius:20px;border:1px solid #d8d8dd;
  background:#fff;font-size:13px;color:#333;cursor:pointer;
  font-family:inherit;transition:.15s;white-space:nowrap;
}
.chip:active{transform:scale(.95);background:#eef4ff;border-color:#9cc3ff}

.frow{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:12px 16px;min-height:50px;
}
.frow + .frow::before{
  content:'';position:absolute;top:0;left:16px;right:0;height:1px;
  background:#e6e6ea;transform:scaleY(.5);
}
.frow label{font-size:15px;color:#000;flex:none;width:96px}
.frow input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  font-size:15px;color:#000;font-family:inherit;padding:0;
}
.frow input::placeholder{color:#b8b8be}
.frow.col{flex-direction:column;align-items:stretch;gap:6px}
.frow.col label{width:auto;font-size:13px;color:#8a8a8e;font-weight:500}
.frow.col input{font-size:15px}

.seg{display:flex;background:#eeeef2;border-radius:9px;padding:2px;gap:2px}
.seg button{
  border:none;background:none;padding:6px 14px;border-radius:7px;
  font-size:13.5px;color:#4a4a4f;cursor:pointer;font-family:inherit;
  transition:.18s;font-weight:500;
}
.seg button.on{background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.14)}

.keywrap{display:flex;align-items:center;gap:8px}
.eye{
  background:none;border:none;padding:4px;cursor:pointer;font-size:16px;
  opacity:.5;flex:none;line-height:1;
}
.eye:hover{opacity:.9}

.btn-danger{
  width:100%;padding:14px;background:none;border:none;cursor:pointer;
  color:#ff3b30;font-size:16px;font-family:inherit;font-weight:400;
}
.btn-danger:active{background:#fff5f5}

.btn-test{
  width:100%;padding:14px;background:none;border:none;cursor:pointer;
  color:#007aff;font-size:16px;font-family:inherit;
}
.btn-test:active{background:#f2f8ff}

/* Toast */
.toast{
  position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:rgba(20,20,26,.92);color:#fff;font-size:13.5px;
  padding:11px 20px;border-radius:22px;z-index:200;
  opacity:0;transition:.28s;pointer-events:none;
  backdrop-filter:blur(10px);max-width:76%;text-align:center;line-height:1.5;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Home 指示条 */
.home-indicator{
  position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
  width:138px;height:5px;border-radius:3px;background:#fff;opacity:.9;
  z-index:80;cursor:pointer;transition:background .3s,opacity .3s;
}
.screen.light .home-indicator{background:#000;opacity:.28}
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="btn-side power"></div>
  <div class="btn-side vup"></div>
  <div class="btn-side vdn"></div>

  <div class="screen" id="screen">

    <!-- 状态栏 -->
    <div class="statusbar">
      <div id="clock">9:41</div>
      <div class="sb-right">
        <!-- 信号 -->
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
          <rect x="0" y="8" width="3" height="4" rx="1"/>
          <rect x="5" y="6" width="3" height="6" rx="1"/>
          <rect x="10" y="3.5" width="3" height="8.5" rx="1"/>
          <rect x="15" y="1" width="3" height="11" rx="1" opacity=".35"/>
        </svg>
        <!-- WiFi -->
        <svg width="17" height="12" viewBox="0 0 24 17" fill="none">
          <path d="M12 15.6 9.2 12.5a4.2 4.2 0 0 1 5.6 0L12 15.6Z" fill="currentColor"/>
          <path d="M5.6 9.5a9.4 9.4 0 0 1 12.8 0" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
          <path d="M1.9 5.6a14.6 14.6 0 0 1 20.2 0" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" opacity=".9"/>
        </svg>
        <!-- 电池 -->
        <svg width="26" height="13" viewBox="0 0 26 13">
          <rect x=".6" y=".6" width="21.5" height="11.8" rx="3.6" fill="none"
                stroke="currentColor" stroke-opacity=".38" stroke-width="1.1"/>
          <rect x="2.3" y="2.3" width="15.5" height="8.4" rx="2.2" fill="currentColor"/>
          <path d="M24.2 4.4c1.5.5 1.5 3.7 0 4.2V4.4Z" fill="currentColor" fill-opacity=".38"/>
        </svg>
      </div>
    </div>
    <div class="island"></div>

    <!-- 桌面 -->
    <div class="desktop" id="desktop">
      <div class="clock-widget">
        <div class="cw-time" id="cwTime">9:41</div>
        <div class="cw-date" id="cwDate">10月4日 星期六</div>
      </div>

      <div class="app-grid">
        <button class="app" data-app="settings">
          <span class="ic g-settings">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3.1"/>
              <path d="M12 2.6v2.5M12 18.9v2.5M21.4 12h-2.5M5.1 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2 5.4 5.4"/>
            </svg>
          </span>
          <span class="label">设置</span>
        </button>

        <button class="app" data-app="chat">
          <span class="ic g-chat">
            <svg viewBox="0 0 24 24">
              <path d="M21 11.5c0 4.1-4 7.4-9 7.4-1 0-2-.1-2.9-.4L4 21l1.3-3.6C3.9 16.1 3 13.9 3 11.5 3 7.4 7 4.1 12 4.1s9 3.3 9 7.4Z"/>
            </svg>
          </span>
          <span class="label">对话</span>
        </button>

        <button class="app" data-app="web">
          <span class="ic g-web">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/>
              <ellipse cx="12" cy="12" rx="3.8" ry="9"/>
              <path d="M3.4 9h17.2M3.4 15h17.2"/>
            </svg>
          </span>
          <span class="label">浏览器</span>
        </button>

        <button class="app" data-app="photo">
          <span class="ic g-photo">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4.5" width="18" height="15" rx="3.2"/>
              <circle cx="8.6" cy="10" r="1.7"/>
              <path d="M4 17.2 9 13l3.4 2.9 3-2.6 4.6 4"/>
            </svg>
          </span>
          <span class="label">相册</span>
        </button>

        <button class="app" data-app="music">
          <span class="ic g-music">
            <svg viewBox="0 0 24 24">
              <path d="M9 17.5V6.2l10-2v11.3"/>
              <circle cx="6.4" cy="17.8" r="2.6"/>
              <circle cx="16.4" cy="15.5" r="2.6"/>
            </svg>
          </span>
          <span class="label">音乐</span>
        </button>

        <button class="app" data-app="clock">
          <span class="ic g-clock">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 6.8V12l3.6 2.2"/>
            </svg>
          </span>
          <span class="label">时钟</span>
        </button>

        <button class="app" data-app="calc">
          <span class="ic g-calc">
            <svg viewBox="0 0 24 24">
              <rect x="4.5" y="3" width="15" height="18" rx="3"/>
              <path d="M8 7.6h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>
            </svg>
          </span>
          <span class="label">计算器</span>
        </button>

        <button class="app" data-app="camera">
          <span class="ic g-cam">
            <svg viewBox="0 0 24 24">
              <path d="M4 8.2h2.6L8.2 5.6h7.6l1.6 2.6H20a1.4 1.4 0 0 1 1.4 1.4v7.6A1.4 1.4 0 0 1 20 18.6H4a1.4 1.4 0 0 1-1.4-1.4v-7.6A1.4 1.4 0 0 1 4 8.2Z"/>
              <circle cx="12" cy="13.2" r="3.4"/>
            </svg>
          </span>
          <span class="label">相机</span>
        </button>
      </div>
    </div>

    <!-- App 容器 -->
    <div class="app-layer" id="appLayer">
      <div class="app">

        <!-- ============ 设置 · 根页面 ============ -->
        <section class="page active" data-page="root">
          <div class="hd"><h1>设置</h1></div>
          <div class="scroll">
            <div class="group">
              <button class="cell" data-go="providers">
                <span class="cell-icon" style="background:linear-gradient(150deg,#4facfe,#0066ff);color:#fff">🔌</span>
                <span class="cell-title">API 供应商</span>
                <span class="cell-value" id="curProviderName">未配置</span>
                <span class="chev">›</span>
              </button>
              <button class="cell" data-toast="模型参数功能开发中">
                <span class="cell-icon" style="background:linear-gradient(150deg,#34d058,#0aa04a);color:#fff">🧠</span>
                <span class="cell-title">模型与参数</span>
                <span class="cell-value">默认</span>
                <span class="chev">›</span>
              </button>
              <button class="cell" data-toast="网络代理功能开发中">
                <span class="cell-icon" style="background:linear-gradient(150deg,#a18cd1,#5b4bd6);color:#fff">🌐</span>
                <span class="cell-title">网络与代理</span>
                <span class="chev">›</span>
              </button>
            </div>

            <div class="group">
              <button class="cell" data-toast="外观设置开发中">
                <span class="cell-icon" style="background:linear-gradient(150deg,#ffd166,#ff7a45);color:#fff">🎨</span>
                <span class="cell-title">外观</span>
                <span class="chev">›</span>
              </button>
              <button class="cell" data-toast="通知设置开发中">
                <span class="cell-icon" style="background:linear-gradient(150deg,#ff5f6d,#c31432);color:#fff">🔔</span>
                <span class="cell-title">通知</span>
                <span class="chev">›</span>
              </button>
              <button class="cell" data-toast="存储与缓存功能开发中">
                <span class="cell-icon" style="background:linear-gradient(150deg,#7f8c9b,#3a4450);color:#fff">💾</span>
                <span class="cell-title">存储空间</span>
                <span class="chev">›</span>
              </button>
            </div>

            <div class="group">
              <button class="cell" data-toast="Mini Phone v1.0.0 · 仿真小手机">
                <span class="cell-icon" style="background:linear-gradient(150deg,#8e8e93,#5a5a60);color:#fff">ℹ️</span>
                <span class="cell-title">关于本机</span>
                <span class="cell-value">v1.0.0</span>
                <span class="chev">›</span>
              </button>
            </div>

            <p class="hint">提示：所有供应商信息仅保存在本机浏览器（localStorage），不会上传到任何服务器。</p>
          </div>
        </section>

        <!-- ============ 设置 · 供应商列表 ============ -->
        <section class="page" data-page="providers">
          <div class="hd">
            <button class="back" data-back="root">‹ 设置</button>
            <h1>API 供应商</h1>
            <button class="act" id="addProvider">＋</button>
          </div>
          <div class="scroll">
            <div class="group" id="providerList"></div>
            <p class="hint">点圆圈可切换当前使用的供应商，点整行可编辑。支持官方站点与中转站两种接入方式。</p>
          </div>
        </section>

        <!-- ============ 设置 · 编辑供应商 ============ -->
        <section class="page" data-page="edit">
          <div class="hd">
            <button class="back" data-back="providers">‹ 返回</button>
            <h1 id="editTitle">添加供应商</h1>
            <button class="act save" id="saveBtn">保存</button>
          </div>
          <div class="scroll">
            <div class="chips" id="presetChips"></div>

            <div class="group">
              <div class="frow">
                <label>类型</label>
                <div class="seg" id="typeSeg">
                  <button data-type="official" class="on">官方站点</button>
                  <button data-type="relay">中转站</button>
                </div>
              </div>
              <div class="frow col">
                <label>名称</label>
                <input id="f-name" type="text" placeholder="例如：OpenAI 官方 / 某某中转">
              </div>
              <div class="frow col">
                <label id="urlLabel">接口地址（Base URL）</label>
                <input id="f-url" type="text" placeholder="https://api.openai.com/v1" spellcheck="false" autocomplete="off">
              </div>
              <div class="frow col">
                <label>API Key 密钥</label>
                <div class="keywrap">
                  <input id="f-key" type="password" placeholder="sk-xxxxxxxxxxxxxxxx" spellcheck="false" autocomplete="off">
                  <button class="eye" id="eyeBtn" type="button">👁</button>
                </div>
              </div>
              <div class="frow col">
                <label>默认模型（可选）</label>
                <input id="f-model" type="text" placeholder="gpt-4o-mini / deepseek-chat" spellcheck="false" autocomplete="off">
              </div>
            </div>

            <div class="group">
              <button class="btn-test" id="testBtn">测试连接</button>
            </div>

            <div class="group" id="delGroup" style="display:none">
              <button class="btn-danger" id="delBtn">删除此供应商</button>
            </div>

            <p class="hint">中转站通常兼容 OpenAI 格式，Base URL 一般以 <b>/v1</b> 结尾。测试连接可能受浏览器跨域（CORS）策略限制，失败不代表密钥无效。</p>
          </div>
        </section>

      </div>
    </div>

    <!-- Home 指示条 -->
    <div class="home-indicator" id="homeIndicator"></div>
  </div>
</div>

<script>
/* ==================== 工具 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const screenEl  = $('#screen');
const desktopEl = $('#desktop');
const appLayer  = $('#appLayer');

/* ==================== 自适应缩放 ==================== */
function fit() {
  const s = Math.min((innerWidth - 28) / 414, (innerHeight - 28) / 868, 1);
  $('#phone').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
fit();

/* ==================== 状态栏时间 ==================== */
function tick() {
  const d = new Date();
  const hh = d.getHours(), mm = String(d.getMinutes()).padStart(2, '0');
  $('#clock').textContent = hh + ':' + mm;
  $('#cwTime').textContent = hh + ':' + mm;
  const wd = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  $('#cwDate').textContent = `${d.getMonth() + 1}月${d.getDate()}日 ${wd}`;
}
tick();
setInterval(tick, 15000);

/* ==================== Toast ==================== */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  screenEl.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 320);
  }, 1700);
}

/* ==================== 数据层 ==================== */
const K_P = 'miniphone.providers.v1';
const K_C = 'miniphone.current.v1';

let providers = [];
let currentId = null;
let editingId = null;
let formType  = 'official';

function loadAll() {
  try { providers = JSON.parse(localStorage.getItem(K_P)) || []; }
  catch (e) { providers = []; }
  currentId = localStorage.getItem(K_C) || null;
  if (providers.length && !providers.some(p => p.id === currentId)) {
    currentId = providers[0].id;
  }
}

function saveAll() {
  localStorage.setItem(K_P, JSON.stringify(providers));
  if (currentId) localStorage.setItem(K_C, currentId);
  else localStorage.removeItem(K_C);
}

/* ==================== 渲染：供应商列表 ==================== */
function renderProviderList() {
  const box = $('#providerList');
  if (!providers.length) {
    box.innerHTML = `
      <div class="empty">
        <span class="big">🔌</span>
        还没有配置任何供应商<br>
        <span>点右上角「＋」添加官方站点或中转站</span>
      </div>`;
    return;
  }
  box.innerHTML = providers.map(p => `
    <div class="cell" data-id="${p.id}">
      <span class="pbadge ${p.type === 'relay' ? 'relay' : 'official'}">${p.type === 'relay' ? '转' : '官'}</span>
      <span class="cell-title">
        <span class="pname">${esc(p.name || '未命名')}</span>
        <span class="purl">${esc(p.url || '未填写接口地址')}</span>
      </span>
      <span class="radio ${p.id === currentId ? 'on' : ''}" data-check="${p.id}"></span>
      <span class="chev">›</span>
    </div>`).join('');
}

function updateHomeHint() {
  const p = providers.find(x => x.id === currentId);
  $('#curProviderName').textContent = p ? p.name : '未配置';
}

/* ==================== 页面导航 ==================== */
function go(page) {
  $$('#appLayer .page').forEach(pg => {
    pg.classList.toggle('active', pg.dataset.page === page);
  });
  const sc = document.querySelector(`#appLayer .page[data-page="${page}"] .scroll`);
  if (sc) sc.scrollTop = 0;
}

/* ==================== 打开 / 关闭 App ==================== */
function launchApp(id) {
  if (id !== 'settings') { toast('该应用还在开发中…'); return; }
  renderProviderList();
  updateHomeHint();
  go('root');
  appLayer.classList.add('open');
  desktopEl.classList.add('behind');
  screenEl.classList.add('light');
}

function closeApp() {
  appLayer.classList.remove('open');
  desktopEl.classList.remove('behind');
  screenEl.classList.remove('light');
}

/* ==================== 桌面图标点击 ==================== */
$$('.app').forEach(btn => {
  btn.addEventListener('click', () => launchApp(btn.dataset.app));
});

/* ==================== 设置内部交互 ==================== */
// 根页面跳转 / 占位
$$('#appLayer [data-go]').forEach(el => {
  el.addEventListener('click', () => go(el.dataset.go));
});
$$('#appLayer [data-toast]').forEach(el => {
  el.addEventListener('click', () => toast(el.dataset.toast));
});
// 返回
$$('#appLayer [data-back]').forEach(el => {
  el.addEventListener('click', () => go(el.dataset.back));
});

// 添加供应商
$('#addProvider').addEventListener('click', () => openEdit(null));

// 列表点击：圆圈切换当前 / 整行编辑
$('#providerList').addEventListener('click', e => {
  const radio = e.target.closest('[data-check]');
  if (radio) {
    currentId = radio.dataset.check;
    saveAll();
    renderProviderList();
    updateHomeHint();
    toast('已切换当前供应商');
    return;
  }
  const cell = e.target.closest('.cell[data-id]');
  if (cell) openEdit(cell.dataset.id);
});

/* ==================== 编辑页 ==================== */
const PRESETS = [
  { label: 'OpenAI 官方',    name: 'OpenAI 官方',    type: 'official', url: 'https://api.openai.com/v1',              model: 'gpt-4o-mini' },
  { label: 'DeepSeek 官方',  name: 'DeepSeek 官方',  type: 'official', url: 'https://api.deepseek.com/v1',             model: 'deepseek-chat' },
  { label: 'Anthropic 官方', name: 'Anthropic 官方', type: 'official', url: 'https://api.anthropic.com/v1',            model: 'claude-3-5-sonnet-20241022' },
  { label: '月之暗面 Kimi',  name: 'Kimi 官方',      type: 'official', url: 'https://api.moonshot.cn/v1',              model: 'moonshot-v1-8k' },
  { label: '中转站模板',      name: '我的中转站',     type: 'relay',    url: 'https://api.example.com/v1',              model: 'gpt-4o-mini' },
];

$('#presetChips').innerHTML = PRESETS
  .map((p, i) => `<button class="chip" data-preset="${i}">${p.label}</button>`).join('');

$('#presetChips').addEventListener('click', e => {
  const chip = e.target.closest('[data-preset]');
  if (!chip) return;
  const p = PRESETS[+chip.dataset.preset];
  $('#f-name').value  = p.name;
  $('#f-url').value   = p.url;
  $('#f-model').value = p.model;
  setType(p.type);
  toast('已填入模板，请补充密钥');
});

function setType(t) {
  formType = t;
  $$('#typeSeg button').forEach(b => b.classList.toggle('on', b.dataset.type === t));
  $('#urlLabel').textContent = t === 'relay'
    ? '中转站地址（Base URL）'
    : '官方接口地址（Base URL）';
  $('#f-url').placeholder = t === 'relay'
    ? 'https://your-relay.com/v1'
    : 'https://api.openai.com/v1';
}
$('#typeSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-type]');
  if (b) setType(b.dataset.type);
});

function openEdit(id) {
  editingId = id || null;
  const p = id ? providers.find(x => x.id === id) : null;

  $('#editTitle').textContent = p ? '编辑供应商' : '添加供应商';
  $('#f-name').value  = p ? (p.name  || '') : '';
  $('#f-url').value   = p ? (p.url   || '') : '';
  $('#f-key').value   = p ? (p.key   || '') : '';
  $('#f-model').value = p ? (p.model || '') : '';
  $('#f-key').type = 'password';
  setType(p ? (p.type || 'official') : 'official');
  $('#delGroup').style.display = p ? 'block' : 'none';

  go('edit');
}

// 显示 / 隐藏密钥
$('#eyeBtn').addEventListener('click', () => {
  const i = $('#f-key');
  i.type = i.type === 'password' ? 'text' : 'password';
  $('#eyeBtn').style.opacity = i.type === 'password' ? '.5' : '1';
});

// 保存
$('#saveBtn').addEventListener('click', () => {
  const name  = $('#f-name').value.trim();
  const url   = $('#f-url').value.trim();
  const key   = $('#f-key').value.trim();
  const model = $('#f-model').value.trim();

  if (!url) { toast('请填写接口地址'); $('#f-url').focus(); return; }
  if (!/^https?:\/\//i.test(url)) { toast('地址需以 http:// 或 https:// 开头'); return; }

  const finalName = name || (formType === 'relay' ? '未命名中转站' : '未命名官方站');

  if (editingId) {
    const p = providers.find(x => x.id === editingId);
    Object.assign(p, { name: finalName, url, key, model, type: formType });
    toast('已保存修改');
  } else {
    const p = { id: uid(), name: finalName, url, key, model, type: formType };
    providers.push(p);
    if (!currentId) currentId = p.id;
    toast('供应商已添加');
  }

  saveAll();
  renderProviderList();
  updateHomeHint();
  go('providers');
});

// 删除
$('#delBtn').addEventListener('click', () => {
  if (!editingId) return;
  if (!confirm('确定要删除这个供应商吗？')) return;
  providers = providers.filter(p => p.id !== editingId);
  if (currentId === editingId) currentId = providers[0] ? providers[0].id : null;
  saveAll();
  renderProviderList();
  updateHomeHint();
  go('providers');
  toast('已删除');
});

// 测试连接
$('#testBtn').addEventListener('click', async () => {
  const url = $('#f-url').value.trim().replace(/\/+$/, '');
  const key = $('#f-key').value.trim();
  if (!url) { toast('请先填写接口地址'); return; }

  const btn = $('#testBtn');
  const old = btn.textContent;
  btn.textContent = '正在测试…';
  btn.disabled = true;

  try {
    const res = await fetch(url + '/models', {
      method: 'GET',
      headers: key ? { 'Authorization': 'Bearer ' + key } : {}
    });
    if (res.ok) {
      let n = '';
      try {
        const j = await res.json();
        if (Array.isArray(j.data)) n = `，发现 ${j.data.length} 个模型`;
      } catch (e) {}
      toast('连接成功 ✓' + n);
    } else {
      toast('接口返回 HTTP ' + res.status);
    }
  } catch (err) {
    toast('请求失败：可能被浏览器跨域(CORS)拦截，或地址不可达');
  } finally {
    btn.textContent = old;
    btn.disabled = false;
  }
});

/* ==================== 回到桌面 ==================== */
$('#homeIndicator').addEventListener('click', () => {
  if (appLayer.classList.contains('open')) closeApp();
});

/* ==================== 启动 ==================== */
loadAll();
renderProviderList();
updateHomeHint();
</script>
</body>
</html>
